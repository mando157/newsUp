* SECTION - 
  ? viewChild() : Get the first matching element from the component's own template ... Returns a Signal containing ElementRef or undefined

  ? viewChildren() : Get all matching elements from the component's own template ... Returns a Signal containing a readonly Array

  ? contentChild() : Get the first matching element projected from the parent ... Returns a Signal containing ElementRef or undefined

  ? contentChildren() : Get all matching projected elements from the parent ... Returns a Signal containing a readonly Array


* SECTION - 
  ? Component Lifecycle
    ~ .1 ~ constructor() : Runs when the component class is instantiated

    ~ .2 ~ ngOnChanges() : Runs when input data changes from parent to child (input() / @Input()) -> runs initially before ngOnInit()

    ~ .3 ~ ngOnInit() : Runs once after Angular initializes the component's inputs -> loading data from (API)

    ~ .4 ~ ngDoCheck() : Runs during every change detection cycle

    ~ .5 ~ ngAfterContentInit() : Runs once after Angular initializes the projected content (ng-content)

    ~ .6 ~ ngAfterContentChecked() : Runs after Angular checks the projected content -> runs during every change detection cycle

    ~ .7 ~ ngAfterViewInit() : Runs once after Angular initializes the component's view and child views -> accessing viewChild()

    ~ .8 ~ ngAfterViewChecked() : Runs after Angular checks the component's view and child views -> runs during every change detection cycle

    ~ .9 ~ ngOnDestroy() : Runs just before the component is destroyed -> cleanup (unsubscribe from Observables)

-->
