<div class="news-card d-flex flex-column">
    <div class="image">
        <img src="{{newsInfo().urlToImage}}" #img (error)="img.src = 'assets/images/image.jpg'" alt="news-image">
        <div class="overlay">
            <!-- <div class="bookmark" (click)="savePost(newsInfo())">
                <i class="fa-regular fa-bookmark"></i>
            </div> -->
            <div class="show">
                <a href="{{newsInfo().url}}" target="_blank">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="card-body d-flex flex-column justify-content-between">

        <div class="content">
            <h5 class="card-title">
                {{(newsInfo().title | slice : 0 : 25) ?? "This Post Doesn't has any title"}} ...
            </h5>
            <p class="card-text">
                {{(newsInfo().description | slice : 0 : 130) ?? "This Post Doesn't has any description"}} ...
            </p>

            <p>{{newsInfo().publishedAt | date}}</p>
        </div>

        <a href="{{newsInfo().url}}" target="_blank" class="mainButton">
            <span>Show More</span>
        </a>
    </div>
</div>
