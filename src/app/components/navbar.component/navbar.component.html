<nav>
    <div class="container">
        <div class="content d-flex align-items-center justify-content-between">
            <div class="logo">
                <img src="assets/images/logo.png" alt="logo">
            </div>

            <div class="controls d-flex align-items-center justify-content-between gap-3">
                <div class="search">
                    <div class="input-group">
                        <input required="" [(ngModel)]="newsService.search" type="text" name="text" autocomplete="off"
                            class="input">
                        <label class="search-label">Search ...</label>
                    </div>
                </div>

                <div class="mood" (click)="toggleTheme()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <g stroke="#F59E0B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <path fill="#F59E0B" fill-opacity="0" stroke-dasharray="34"
                                d="M12 7c2.76 0 5 2.24 5 5c0 2.76 -2.24 5 -5 5c-2.76 0 -5 -2.24 -5 -5c0 -2.76 2.24 -5 5 -5Z">
                                <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="34;0" />
                                <animate fill="freeze" attributeName="fill-opacity" begin="0.5s" dur="0.4s" to="1" />
                            </path>
                            <g fill="none">
                                <path d="M12 21v1M21 12h1M12 3v-1M3 12h-1" opacity="0">
                                    <animateTransform attributeName="transform" dur="30s" repeatCount="indefinite"
                                        type="rotate" values="0 12 12;360 12 12" />
                                    <set fill="freeze" attributeName="opacity" begin="1s" to="1" />
                                    <animate fill="freeze" attributeName="d" begin="1s" dur="0.2s"
                                        values="M12 19v1M19 12h1M12 5v-1M5 12h-1;M12 21v1M21 12h1M12 3v-1M3 12h-1" />
                                </path>
                                <path d="M18.5 18.5l0.5 0.5M18.5 5.5l0.5 -0.5M5.5 5.5l-0.5 -0.5M5.5 18.5l-0.5 0.5"

                                        type="rotate" values="0 12 12;360 12 12" />
                                    <set fill="freeze" attributeName="opacity" begin="1.2s" to="1" />
                                    <animate fill="freeze" attributeName="d" begin="1.2s" dur="0.2s"
